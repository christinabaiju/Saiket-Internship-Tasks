<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Do. — To-Do List</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:          #F5F3EE;
      --surface:     #FFFFFF;
      --surface2:    #F0EDE7;
      --border:      #E2DED6;
      --text:        #1A1815;
      --muted:       #9C9589;
      --accent:      #2D6A4F;       /* deep forest green */
      --accent-lt:   #52B788;
      --accent-bg:   #D8F3DC;
      --danger:      #C1440E;
      --danger-bg:   #FDEEE8;
      --done-text:   #A8A29E;

      --ff-display:  'Syne', system-ui, sans-serif;
      --ff-body:     'Inter', system-ui, sans-serif;

      --radius-sm:   8px;
      --radius:      14px;
      --radius-lg:   20px;
      --shadow:      0 2px 12px rgba(0,0,0,.07);
      --shadow-lg:   0 8px 32px rgba(0,0,0,.10);
      --trans:       180ms ease;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: var(--ff-body);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem 4rem;
    }

    .app-shell {
      max-width: 600px;
      margin: 0 auto;
    }

    .app-header {
      margin-bottom: 2rem;
    }
    .app-header-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: .3rem;
    }
    .app-title {
      font-family: var(--ff-display);
      font-size: 2.8rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -1.5px;
      color: var(--text);
    }
    /* Signature: the dot in "Do." is the accent colour — simple, memorable */
    .app-title .dot { color: var(--accent); }

    .date-badge {
      font-size: .78rem;
      font-weight: 600;
      color: var(--muted);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: .35rem .9rem;
      margin-top: .5rem;
      white-space: nowrap;
    }

    .progress-row {
      display: flex;
      align-items: center;
      gap: .75rem;
      margin-top: 1rem;
    }
    .progress-track {
      flex: 1;
      height: 5px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-lt));
      border-radius: 99px;
      transition: width .5s cubic-bezier(.4,0,.2,1);
    }
    .progress-label {
      font-size: .78rem;
      font-weight: 600;
      color: var(--muted);
      white-space: nowrap;
      min-width: 48px;
      text-align: right;
    }

    .add-form {
      display: flex;
      gap: .6rem;
      margin-bottom: 1.25rem;
    }
    .add-input {
      flex: 1;
      padding: .85rem 1.1rem;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      font-family: var(--ff-body);
      font-size: .95rem;
      color: var(--text);
      outline: none;
      transition: border-color var(--trans), box-shadow var(--trans);
    }
    .add-input::placeholder { color: var(--muted); }
    .add-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(45,106,79,.12);
    }
    .add-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .4rem;
      padding: .85rem 1.3rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-family: var(--ff-body);
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background var(--trans), transform var(--trans), box-shadow var(--trans);
    }
    .add-btn:hover {
      background: var(--accent-lt);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(45,106,79,.3);
    }
    .add-btn:active { transform: translateY(0); }
    .add-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }


    .filter-row {
      display: flex;
      gap: .4rem;
      margin-bottom: 1rem;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }
    .filter-row::-webkit-scrollbar { display: none; }

    .filter-btn {
      padding: .4rem .95rem;
      border: 1.5px solid var(--border);
      border-radius: 99px;
      background: var(--surface);
      font-family: var(--ff-body);
      font-size: .82rem;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      white-space: nowrap;
      transition: border-color var(--trans), color var(--trans), background var(--trans);
    }
    .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }


    .sort-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: .75rem;
    }
    .task-count {
      font-size: .8rem;
      font-weight: 600;
      color: var(--muted);
    }
    .clear-done-btn {
      font-size: .8rem;
      font-weight: 600;
      color: var(--danger);
      background: none;
      border: none;
      cursor: pointer;
      padding: .2rem .5rem;
      border-radius: 6px;
      transition: background var(--trans);
    }
    .clear-done-btn:hover { background: var(--danger-bg); }
    .clear-done-btn:disabled { opacity: 0.35; cursor: default; }


    .task-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: .55rem;
    }

    /* ── Task item ── */
    .task-item {
      display: flex;
      align-items: center;
      gap: .85rem;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: .9rem 1rem;
      box-shadow: var(--shadow);
      transition: border-color var(--trans), box-shadow var(--trans), opacity var(--trans), transform var(--trans);
      position: relative;
      overflow: hidden;
    }
    .task-item:hover { border-color: #C8C3BB; box-shadow: var(--shadow-lg); }

    /* slide-in animation */
    .task-item.entering {
      animation: slideDown .25s ease forwards;
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    /* slide-out animation */
    .task-item.removing {
      animation: slideOut .22s ease forwards;
    }
    @keyframes slideOut {
      to { opacity: 0; transform: translateX(30px); max-height: 0; padding: 0; margin: 0; border-width: 0; }
    }

    /* done state */
    .task-item.done { border-color: var(--border); }
    .task-item.done .task-text {
      text-decoration: line-through;
      color: var(--done-text);
    }

    /* ── Checkbox ── */
    .task-check {
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      border: 2px solid var(--border);
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background var(--trans), border-color var(--trans), transform var(--trans);
    }
    .task-check:hover { border-color: var(--accent); transform: scale(1.1); }
    .task-item.done .task-check {
      background: var(--accent);
      border-color: var(--accent);
    }
    .task-check svg {
      width: 12px; height: 12px;
      stroke: #fff;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0;
      transform: scale(.5);
      transition: opacity var(--trans), transform var(--trans);
    }
    .task-item.done .task-check svg { opacity: 1; transform: scale(1); }

    /* ── Task text (view mode) ── */
    .task-text {
      flex: 1;
      font-size: .95rem;
      line-height: 1.45;
      word-break: break-word;
      color: var(--text);
      transition: color var(--trans);
    }

    /* ── Edit input (edit mode) ── */
    .task-edit-input {
      flex: 1;
      border: none;
      border-bottom: 2px solid var(--accent);
      background: transparent;
      font-family: var(--ff-body);
      font-size: .95rem;
      color: var(--text);
      outline: none;
      padding: .1rem 0;
    }

    /* ── Actions ── */
    .task-actions {
      display: flex;
      gap: .3rem;
      flex-shrink: 0;
      opacity: 0;
      transition: opacity var(--trans);
    }
    .task-item:hover .task-actions,
    .task-item:focus-within .task-actions { opacity: 1; }

    .icon-btn {
      width: 32px; height: 32px;
      border: none;
      border-radius: var(--radius-sm);
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .9rem;
      transition: background var(--trans), transform var(--trans);
      flex-shrink: 0;
    }
    .icon-btn:hover { transform: scale(1.12); }
    .edit-btn:hover   { background: var(--accent-bg); color: var(--accent); }
    .save-btn:hover   { background: var(--accent-bg); color: var(--accent); }
    .delete-btn:hover { background: var(--danger-bg); color: var(--danger); }
    .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .empty-state {
      text-align: center;
      padding: 3rem 1.5rem;
      display: none;
    }
    .empty-state.show { display: block; }
    .empty-icon {
      font-size: 2.5rem;
      margin-bottom: .75rem;
      display: block;
    }
    .empty-state h3 {
      font-family: var(--ff-display);
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: .4rem;
    }
    .empty-state p { font-size: .88rem; color: var(--muted); }

    .toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--text);
      color: #fff;
      font-size: .85rem;
      font-weight: 500;
      padding: .6rem 1.2rem;
      border-radius: 99px;
      white-space: nowrap;
      box-shadow: 0 4px 16px rgba(0,0,0,.2);
      transition: transform .28s cubic-bezier(.34,1.56,.64,1), opacity .28s ease;
      opacity: 0;
      z-index: 999;
      pointer-events: none;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media (max-width: 480px) {
      body { padding: 1.25rem .75rem 3rem; }
      .app-title { font-size: 2.2rem; }
      .add-btn span.btn-label { display: none; }   
      .task-actions { opacity: 1; }               
    }
  </style>
</head>
<body>

<div class="app-shell">

  <header class="app-header">
    <div class="app-header-top">
      <h1 class="app-title">Do<span class="dot">.</span></h1>
      <span class="date-badge" id="dateBadge"></span>
    </div>
    <div class="progress-row">
      <div class="progress-track">
        <div class="progress-fill" id="progressFill" style="width:0%"></div>
      </div>
      <span class="progress-label" id="progressLabel">0 / 0</span>
    </div>
  </header>

  <div class="add-form">
    <input
      class="add-input"
      id="addInput"
      type="text"
      placeholder="Add a new task…"
      maxlength="200"
      autocomplete="off"
    />
    <button class="add-btn" id="addBtn" onclick="addTask()">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="8" y1="2" x2="8" y2="14"/><line x1="2" y1="8" x2="14" y2="8"/>
      </svg>
      <span class="btn-label">Add task</span>
    </button>
  </div>


  <div class="filter-row" role="group" aria-label="Filter tasks">
    <button class="filter-btn active" data-filter="all"       onclick="setFilter('all',this)">All</button>
    <button class="filter-btn"        data-filter="active"    onclick="setFilter('active',this)">Active</button>
    <button class="filter-btn"        data-filter="completed" onclick="setFilter('completed',this)">Completed</button>
  </div>

  <div class="sort-bar">
    <span class="task-count" id="taskCount"></span>
    <button class="clear-done-btn" id="clearDoneBtn" onclick="clearCompleted()" disabled>
      Clear completed
    </button>
  </div>


  <ul class="task-list" id="taskList" aria-label="Task list"></ul>

  <div class="empty-state" id="emptyState">
    <span class="empty-icon" id="emptyIcon">✅</span>
    <h3 id="emptyTitle">Nothing here yet</h3>
    <p id="emptyMsg">Add your first task above to get started.</p>
  </div>

</div>


<div class="toast" id="toast"></div>


<script>

let tasks  = JSON.parse(localStorage.getItem('do-tasks') || '[]');
let filter = 'all';
let nextId = parseInt(localStorage.getItem('do-nextId') || '1', 10);


function save() {
  localStorage.setItem('do-tasks',  JSON.stringify(tasks));
  localStorage.setItem('do-nextId', nextId);
}

let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}


function renderDate() {
  const d = new Date();
  document.getElementById('dateBadge').textContent = d.toLocaleDateString('en-US', {
    weekday: 'short', month: 'short', day: 'numeric'
  });
}


function renderProgress() {
  const total = tasks.length;
  const done  = tasks.filter(t => t.done).length;
  const pct   = total ? Math.round(done / total * 100) : 0;

  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = done + ' / ' + total;
}


function setFilter(f, btn) {
  filter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderList();
}

function filteredTasks() {
  if (filter === 'active')    return tasks.filter(t => !t.done);
  if (filter === 'completed') return tasks.filter(t =>  t.done);
  return tasks;
}


function renderList() {
  const list  = document.getElementById('taskList');
  const empty = document.getElementById('emptyState');
  const shown = filteredTasks();

  // count label
  const activeCt = tasks.filter(t => !t.done).length;
  const label     = activeCt === 1 ? '1 task left' : activeCt + ' tasks left';
  document.getElementById('taskCount').textContent = label;

  // clear-done button
  const hasDone = tasks.some(t => t.done);
  document.getElementById('clearDoneBtn').disabled = !hasDone;

  // progress
  renderProgress();

  // empty state
  if (shown.length === 0) {
    list.innerHTML = '';
    empty.classList.add('show');
    if (filter === 'completed') {
      document.getElementById('emptyIcon').textContent  = '🎯';
      document.getElementById('emptyTitle').textContent = 'No completed tasks';
      document.getElementById('emptyMsg').textContent   = 'Finish a task and it will show up here.';
    } else if (filter === 'active') {
      document.getElementById('emptyIcon').textContent  = '🎉';
      document.getElementById('emptyTitle').textContent = 'All caught up!';
      document.getElementById('emptyMsg').textContent   = 'No active tasks. Enjoy the clear slate.';
    } else {
      document.getElementById('emptyIcon').textContent  = '✅';
      document.getElementById('emptyTitle').textContent = 'Nothing here yet';
      document.getElementById('emptyMsg').textContent   = 'Add your first task above to get started.';
    }
    return;
  }
  empty.classList.remove('show');

  // diff-render: only rebuild if needed
  list.innerHTML = '';
  shown.forEach(task => {
    list.appendChild(buildTaskEl(task));
  });
}

function buildTaskEl(task) {
  const li = document.createElement('li');
  li.className  = 'task-item' + (task.done ? ' done' : '');
  li.dataset.id = task.id;

  li.innerHTML = `
    <!-- Checkbox -->
    <button
      class="task-check"
      onclick="toggleDone(${task.id})"
      aria-label="${task.done ? 'Mark incomplete' : 'Mark complete'}"
      title="${task.done ? 'Mark incomplete' : 'Mark complete'}"
    >
      <svg viewBox="0 0 12 10" fill="none">
        <polyline points="1.5,5.5 4.5,8.5 10.5,1.5"/>
      </svg>
    </button>

    <!-- Text -->
    <span class="task-text">${escHtml(task.text)}</span>

    <!-- Actions -->
    <div class="task-actions">
      <button class="icon-btn edit-btn"
        onclick="startEdit(${task.id})"
        aria-label="Edit task"
        title="Edit">✏️</button>
      <button class="icon-btn delete-btn"
        onclick="deleteTask(${task.id})"
        aria-label="Delete task"
        title="Delete">🗑️</button>
    </div>
  `;
  return li;
}

function addTask() {
  const input = document.getElementById('addInput');
  const text  = input.value.trim();

  if (!text) {
    input.focus();
    input.style.borderColor = '#C1440E';
    input.style.boxShadow   = '0 0 0 3px rgba(193,68,14,.12)';
    setTimeout(() => {
      input.style.borderColor = '';
      input.style.boxShadow   = '';
    }, 1200);
    showToast('⚠️ Please type a task first.');
    return;
  }

  const task = { id: nextId++, text, done: false, createdAt: Date.now() };
  tasks.unshift(task);
  save();
  input.value = '';
  renderList();

  // animate the new item
  const firstEl = document.querySelector('.task-item');
  if (firstEl) {
    firstEl.classList.add('entering');
    firstEl.addEventListener('animationend', () => firstEl.classList.remove('entering'), { once: true });
  }
  showToast('✅ Task added!');
}

function toggleDone(id) {
  const task = tasks.find(t => t.id === id);
  if (!task) return;
  task.done = !task.done;
  save();
  renderList();
  showToast(task.done ? '🎉 Task completed!' : '↩️ Marked as active.');
}

function startEdit(id) {
  const task = tasks.find(t => t.id === id);
  if (!task) return;

  const li        = document.querySelector(`.task-item[data-id="${id}"]`);
  const textSpan  = li.querySelector('.task-text');
  const actions   = li.querySelector('.task-actions');

  // swap text span → input
  const editInput = document.createElement('input');
  editInput.className = 'task-edit-input';
  editInput.type      = 'text';
  editInput.value     = task.text;
  editInput.maxLength = 200;
  li.replaceChild(editInput, textSpan);

  // swap buttons → save + cancel
  actions.innerHTML = `
    <button class="icon-btn save-btn"   onclick="saveEdit(${id})"   title="Save">💾</button>
    <button class="icon-btn delete-btn" onclick="cancelEdit(${id})" title="Cancel">✕</button>
  `;

  editInput.focus();
  editInput.select();

  // save on Enter, cancel on Escape
  editInput.addEventListener('keydown', e => {
    if (e.key === 'Enter')  saveEdit(id);
    if (e.key === 'Escape') cancelEdit(id);
  });
}

function saveEdit(id) {
  const li    = document.querySelector(`.task-item[data-id="${id}"]`);
  const input = li.querySelector('.task-edit-input');
  const text  = input ? input.value.trim() : '';

  if (!text) {
    showToast('⚠️ Task text cannot be empty.');
    input && input.focus();
    return;
  }

  const task = tasks.find(t => t.id === id);
  if (task) { task.text = text; save(); }
  renderList();
  showToast('✏️ Task updated!');
}

function cancelEdit(id) {
  renderList();   // just re-render to restore view mode
}

function deleteTask(id) {
  const li = document.querySelector(`.task-item[data-id="${id}"]`);
  if (li) {
    li.classList.add('removing');
    li.addEventListener('animationend', () => {
      tasks = tasks.filter(t => t.id !== id);
      save();
      renderList();
    }, { once: true });
  }
  showToast('🗑️ Task deleted.');
}

function clearCompleted() {
  const doneCt = tasks.filter(t => t.done).length;
  if (!doneCt) return;
  tasks = tasks.filter(t => !t.done);
  save();
  renderList();
  showToast(`🧹 Cleared ${doneCt} completed task${doneCt > 1 ? 's' : ''}.`);
}

document.getElementById('addInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') addTask();
});

function escHtml(str) {
  return str
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

renderDate();
renderList();
</script>
</body>
</html>
